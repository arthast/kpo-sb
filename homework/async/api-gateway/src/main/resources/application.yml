spring:
  application:
    name: api-gateway

server:
  port: 8080

# URLs сервисов
services:
  order-service:
    url: ${ORDER_SERVICE_URL:http://localhost:8082}
  payment-service:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8081}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
